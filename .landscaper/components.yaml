components:
  - name: github.com/openmcp-project/landscaper-service
    version: ${VERSION}
    provider:
      name: ${PROVIDER}
    componentReferences:
      - name: landscaper-instance
        componentName: github.com/openmcp-project/landscaper-service/landscaper-instance
        version: ${VERSION}
      - name: ingress-controller
        componentName: github.com/openmcp-project/landscaper-service/ingress-controller
        version: ${VERSION}
    resources:
      - name: source
        type: blob
        version: ${VERSION}
        access:
          type: Git/v1
          commit: ${COMMIT_SHA}
          ref: refs/tags/${VERSION}
          repository: https://github.com/openmcp-project/landscaper-service
      - name: landscaper-service-blueprint
        type: landscaper.gardener.cloud/blueprint
        input:
          type: Dir/v1
          path: ./.landscaper/blueprint
          compress: true
          mediaType: application/vnd.gardener.landscaper.blueprint.layer.v1.tar+gzip
      - name: landscaper-service-chart
        type: helmChart
        input:
          type: Helm/v1
          path: ${LANDSCAPER_SERVICE_CHART_PATH}
      - name: landscaper-service-controller
        type: ociImage
        version: ${VERSION}
        access:
          type: OCIImage/v1
          imageReference: "${IMAGE_REGISTRY}/landscaper-service-controller:${VERSION}"
      - name: landscaper-service-webhooks-server
        type: ociImage
        version: ${VERSION}
        access:
          type: OCIImage/v1
          imageReference: "${IMAGE_REGISTRY}/landscaper-service-webhooks-server:${VERSION}"
      - name: landscaper-service-target-shoot-sidecar-server
        type: ociImage
        version: ${VERSION}
        access:
          type: OCIImage/v1
          imageReference: "${IMAGE_REGISTRY}/landscaper-service-target-shoot-sidecar-server:${VERSION}"

  - name: github.com/openmcp-project/landscaper-service/landscaper-instance
    version: ${VERSION}
    provider:
      name: ${PROVIDER}
    componentReferences:
      - name: landscaper
        componentName: github.com/openmcp-project/landscaper
        version: ${LANDSCAPER_VERSION}
    resources:
      - name: source
        type: blob
        version: ${VERSION}
        access:
          type: Git/v1
          commit: ${COMMIT_SHA}
          ref: refs/tags/${VERSION}
          repository: https://github.com/openmcp-project/landscaper-service
      - name: rbac-blueprint
        type: landscaper.gardener.cloud/blueprint
        input:
          type: Dir/v1
          path: ./.landscaper/landscaper-instance/blueprint/rbac
          compress: true
          mediaType: application/vnd.gardener.landscaper.blueprint.layer.v1.tar+gzip
      - name: landscaper-blueprint
        type: landscaper.gardener.cloud/blueprint
        input:
          type: Dir/v1
          path: ./.landscaper/landscaper-instance/blueprint/landscaper
          compress: true
          mediaType: application/vnd.gardener.landscaper.blueprint.layer.v1.tar+gzip
      - name: shoot-blueprint
        type: landscaper.gardener.cloud/blueprint
        input:
          type: Dir/v1
          path: ./.landscaper/landscaper-instance/blueprint/shoot
          compress: true
          mediaType: application/vnd.gardener.landscaper.blueprint.layer.v1.tar+gzip
      - name: sidecar-blueprint
        type: landscaper.gardener.cloud/blueprint
        input:
          type: Dir/v1
          path: ./.landscaper/landscaper-instance/blueprint/ls-service-target-shoot-sidecar-server
          compress: true
          mediaType: application/vnd.gardener.landscaper.blueprint.layer.v1.tar+gzip
      - name: sidecar-rbac-blueprint
        type: landscaper.gardener.cloud/blueprint
        input:
          type: Dir/v1
          path: ./.landscaper/landscaper-instance/blueprint/sidecar-rbac
          compress: true
          mediaType: application/vnd.gardener.landscaper.blueprint.layer.v1.tar+gzip
      - name: installation-blueprint
        type: landscaper.gardener.cloud/blueprint
        input:
          type: Dir/v1
          path: ./.landscaper/landscaper-instance/blueprint/installation
          compress: true
          mediaType: application/vnd.gardener.landscaper.blueprint.layer.v1.tar+gzip
      - name: installation-blueprint-ext-dataplane
        type: landscaper.gardener.cloud/blueprint
        input:
          type: Dir/v1
          path: ./.landscaper/landscaper-instance/blueprint/installation-ext-dataplane
          compress: true
          mediaType: application/vnd.gardener.landscaper.blueprint.layer.v1.tar+gzip
      - name: ls-service-target-shoot-sidecar-chart
        type: helmChart
        input:
          type: Helm/v1
          path: ${SHOOT_SIDECAR_CHART_PATH}
      - name: sidecar-rbac-chart
        type: helmChart
        input:
          type: Helm/v1
          path: ${SHOOT_SIDECAR_RBAC_CHART_PATH}
      - name: ls-service-target-shoot-sidecar-image
        type: ociImage
        version: ${VERSION}
        access:
          type: OCIImage/v1
          imageReference: "${IMAGE_REGISTRY}/landscaper-service-target-shoot-sidecar-server:${VERSION}"
      - name: registry-config-definition
        type: landscaper.gardener.cloud/jsonschema
        input:
          type: File/v1
          path: ./.landscaper/landscaper-instance/definition/registry-configuration.json
          compress: true
          mediaType: application/vnd.gardener.landscaper.jsonschema.layer.v1.json
      - name: landscaper-config-definition
        type: landscaper.gardener.cloud/jsonschema
        input:
          type: File/v1
          path: ./.landscaper/landscaper-instance/definition/landscaper-configuration.json
          compress: true
          mediaType: application/vnd.gardener.landscaper.jsonschema.layer.v1.json
      - name: shoot-config-definition
        type: landscaper.gardener.cloud/jsonschema
        input:
          type: File/v1
          path: ./.landscaper/landscaper-instance/definition/shoot-configuration.json
          compress: true
          mediaType: application/vnd.gardener.landscaper.jsonschema.layer.v1.json
      - name: sidecar-config-definition
        type: landscaper.gardener.cloud/jsonschema
        input:
          type: File/v1
          path: ./.landscaper/landscaper-instance/definition/sidecar-configuration.json
          compress: true
          mediaType: application/vnd.gardener.landscaper.jsonschema.layer.v1.json
      - name: rotation-config-definition
        type: landscaper.gardener.cloud/jsonschema
        input:
          type: File/v1
          path: ./.landscaper/landscaper-instance/definition/rotation-configuration.json
          compress: true
          mediaType: application/vnd.gardener.landscaper.jsonschema.layer.v1.json

  - name: github.com/openmcp-project/landscaper-service/ingress-controller
    version: ${VERSION}
    provider:
      name: ${PROVIDER}
    resources:
      - name: source
        type: blob
        version: ${VERSION}
        access:
          type: Git/v1
          commit: ${COMMIT_SHA}
          ref: refs/tags/${VERSION}
          repository: https://github.com/openmcp-project/landscaper-service
      - name: ingress-controller-blueprint
        type: landscaper.gardener.cloud/blueprint
        input:
          type: Dir/v1
          path: ./.landscaper/ingress-controller/blueprint
          compress: true
          mediaType: application/vnd.gardener.landscaper.blueprint.layer.v1.tar+gzip
      - name: ingress-nginx-chart
        type: helmChart
        version: ${INGRESS_NGINX_CHART_VERSION}
        input:
          type: Helm/v1
          helmRepository: "https://kubernetes.github.io/ingress-nginx/ingress-nginx:${INGRESS_NGINX_CHART_VERSION}"
      - name: ingress-nginx-controller
        type: ociImage
        version: ${INGRESS_NGINX_IMAGE_VERSION}
        access:
          type: OCIImage/v1
          imageReference: "registry.k8s.io/ingress-nginx/controller:${INGRESS_NGINX_IMAGE_VERSION}"
